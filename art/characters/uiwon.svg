<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background circle -->
  <circle cx="128" cy="120" r="110" fill="#1a2a1a"/>

  <!-- Body - hanbok silhouette -->
  <ellipse cx="128" cy="185" rx="52" ry="45" fill="#3a7a5a"/>
  <!-- Upper body -->
  <rect x="104" y="120" width="48" height="50" rx="8" fill="#4a9a6a"/>
  <!-- Jeogori (jacket) collar -->
  <path d="M112 120 L128 140 L144 120" fill="none" stroke="#6ad0a0" stroke-width="3"/>
  <!-- Sleeves -->
  <ellipse cx="94" cy="140" rx="18" ry="12" fill="#4a9a6a" transform="rotate(-15 94 140)"/>
  <ellipse cx="162" cy="140" rx="18" ry="12" fill="#4a9a6a" transform="rotate(15 162 140)"/>

  <!-- Head -->
  <circle cx="128" cy="90" r="32" fill="#e8c9a0"/>
  <!-- Hair - traditional jjokmeori -->
  <ellipse cx="128" cy="76" rx="34" ry="22" fill="#2a1a0a"/>
  <circle cx="128" cy="60" r="10" fill="#2a1a0a"/>
  <!-- Binyeo (hairpin) -->
  <line x1="115" y1="62" x2="141" y2="62" stroke="#6ad0a0" stroke-width="2.5"/>

  <!-- Eyes - cute chibi style -->
  <ellipse cx="118" cy="92" rx="4" ry="5" fill="#1a1a1a"/>
  <ellipse cx="138" cy="92" rx="4" ry="5" fill="#1a1a1a"/>
  <circle cx="119" cy="90" r="1.5" fill="white"/>
  <circle cx="139" cy="90" r="1.5" fill="white"/>
  <!-- Blush -->
  <ellipse cx="112" cy="100" rx="6" ry="3" fill="#e0a0a0" opacity="0.4"/>
  <ellipse cx="144" cy="100" rx="6" ry="3" fill="#e0a0a0" opacity="0.4"/>
  <!-- Mouth -->
  <path d="M124 104 Q128 108 132 104" fill="none" stroke="#8a5a4a" stroke-width="1.5"/>

  <!-- Medical cross symbol on chest -->
  <rect x="122" y="148" width="12" height="3" rx="1" fill="#d0ffd0"/>
  <rect x="126" y="144" width="4" height="11" rx="1" fill="#d0ffd0"/>

  <!-- Herb pouch -->
  <ellipse cx="150" cy="170" rx="10" ry="8" fill="#2a5a3a" stroke="#6ad0a0" stroke-width="1"/>
  <line x1="150" y1="162" x2="150" y2="166" stroke="#6ad0a0" stroke-width="1.5"/>

  <!-- Chima (skirt) pattern lines -->
  <path d="M100 190 Q128 200 156 190" fill="none" stroke="#2a5a3a" stroke-width="1.5"/>
  <path d="M95 200 Q128 210 161 200" fill="none" stroke="#2a5a3a" stroke-width="1.5"/>

  <!-- Korean label -->
  <text x="128" y="245" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#6ad0a0">의녀</text>
</svg>